<meta charset="utf-8">
<title>자산 신호판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 휴대폰 한 줄 세로 흐름 — 맨 위 세 칸 요약(살 것·팔 것·보유) → 상태별 자산 카드(누르면 차트) */
:root{
 --bg:#F4F6FA; --card:#FFFFFF; --line:#E3E9F2; --fg:#141B26; --sub:#5B6676; --mute:#8D97A6;
 --buy:#12A150; --buy-bg:#E7F6EE; --sell:#E5700A; --sell-bg:#FFF0E2; --hold:#2B6BF3; --hold-bg:#EAF1FF;
 --track:#EDF0F5; --grid:#EEF1F6; --badband:rgba(120,128,140,.18); --line-main:#2B6BF3; --tip-bg:#141B26; --tip-fg:#FFFFFF;
 --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0E131A; --card:#161D27; --line:#253041; --fg:#E9EEF5; --sub:#A4AFBF; --mute:#748094;
 --buy:#3CC77A; --buy-bg:#123222; --sell:#F2994A; --sell-bg:#3A2614; --hold:#6E9AF8; --hold-bg:#18243D;
 --track:#222B37; --grid:#1E2733; --badband:rgba(170,180,195,.16); --line-main:#6E9AF8; --tip-bg:#E9EEF5; --tip-fg:#0E131A; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0E131A; --card:#161D27; --line:#253041; --fg:#E9EEF5; --sub:#A4AFBF; --mute:#748094;
 --buy:#3CC77A; --buy-bg:#123222; --sell:#F2994A; --sell-bg:#3A2614; --hold:#6E9AF8; --hold-bg:#18243D;
 --track:#222B37; --grid:#1E2733; --badband:rgba(170,180,195,.16); --line-main:#6E9AF8; --tip-bg:#E9EEF5; --tip-fg:#0E131A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 36px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:14px}
header h1{font-size:22px;font-weight:700;margin:0}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border-radius:14px;padding:12px 10px;display:grid;gap:4px;min-width:0}
.tile .k{font-size:12.5px;font-weight:500}
.tile .n{font-size:24px;font-weight:700;line-height:1.1}
.tile .w{font-size:12px;line-height:1.35;word-break:keep-all}
.t-buy{background:var(--buy-bg);color:var(--buy)} .t-sell{background:var(--sell-bg);color:var(--sell)} .t-hold{background:var(--hold-bg);color:var(--hold)}
.sec{font-size:13px;color:var(--sub);font-weight:500;margin:6px 2px -4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nm{font-size:17px;font-weight:700}
.prod{font-size:12.5px;color:var(--mute);margin-top:-8px}
.pill{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.p-매수{background:var(--buy-bg);color:var(--buy)} .p-강한관망{background:var(--red);color:#fff} .p-관망,.p-관망유지{background:var(--sell-bg);color:var(--sell)} .p-보통{background:var(--hold-bg);color:var(--hold)}
.note{font-size:12.5px;color:var(--sub);background:var(--track);border-radius:10px;padding:8px 10px}
.act{font-size:15px;font-weight:500}
.prob{display:grid;gap:6px}
.prob .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.prob .lab{font-size:12.5px;color:var(--sub)}
.prob .big{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.mini{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
button.more{all:unset;cursor:pointer;font-size:13px;color:var(--hold);font-weight:500;justify-self:start;padding:2px 0}
button.more:focus-visible{outline:2px solid var(--hold);outline-offset:2px;border-radius:4px}
.chartbox{display:grid;gap:8px}
.chips{display:flex;gap:6px}
.chips button{font:inherit;font-size:12.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.chips button.sel{background:var(--hold);border-color:var(--hold);color:#fff}
canvas{width:100%;height:240px;display:block;cursor:crosshair}
.hint{font-size:12px;color:var(--mute)}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--sub)}
.leg i{display:inline-block;width:12px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.eph{font-size:12.5px;font-weight:700;margin-top:4px}
.eps{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.eps li{display:flex;gap:8px;align-items:flex-start}
.eps i{flex:none;min-width:28px;font-style:normal;font-size:11.5px;font-weight:700}
.eps b{color:var(--fg)}
.todo{display:grid;gap:6px;margin-top:8px}
.tr{display:grid;grid-template-columns:64px auto 1fr;gap:8px;align-items:center;background:rgba(255,255,255,.14);border-radius:10px;padding:7px 10px;min-width:0}
.tn{font-weight:700;font-size:14px}
.ta{font-weight:700;font-size:13px;background:#fff;color:var(--c);border-radius:999px;padding:2px 9px;white-space:nowrap}
.tw{font-size:12px;opacity:.9;min-width:0}
.why{margin:10px 0 0;font-size:13px;line-height:1.6;opacity:.95}
.prob .big{font-family:var(--sans);font-size:22px;font-weight:700}
.prob .row{border:0!important;box-shadow:none!important;border-radius:0!important}
.tally{display:flex;flex-wrap:wrap;gap:4px}
.tally i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.tally i.n{background:transparent;border:2px solid var(--mute);opacity:.6}
.fxbar{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--hold-bg),var(--sell-bg));margin-top:4px}
.fxbar i{position:absolute;top:-4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--hold);border:2px solid var(--card)}
.fxbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--mute)}
.fxlab{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.exrows{display:grid;gap:6px}
.exr{display:grid;grid-template-columns:64px auto 1fr;gap:8px;align-items:center;font-size:13px}
.exr .ta{background:var(--track)}
.exr .tw{font-size:12.5px;color:var(--sub)}
.crit{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:12.5px;color:var(--sub)}
.crit dt{font-weight:700;color:var(--fg)}
.crit dd{margin:0;min-width:0}
.hint{display:none}
.foot{font-size:12px;color:var(--mute);line-height:1.6}
/* 집셈 스타일 덮어쓰기 (10-21 사용자: 'UI 스타일을 집셈 스타일 따라') — 부동산시세/theme_ref.py 의 토큰·부품 그대로 */
:root{
 --bg:#F5F7FA; --card:#FFFFFF; --line:#E3E9F2; --fg:#131A2B; --sub:#454D5C; --mute:#636C7E;
 --blue:#2B6BF3; --hold:#2B6BF3; --hold-bg:#EAF1FF; --ok-bg:#EAF1FF; --line-main:#2B6BF3;
 --buy:#0F8048; --buy-bg:#E6F6EC; --sell:#F08C00; --sell-bg:#FFF4E5; --red:#CC3338;
 --gray-bg:#EEF2F7; --track:#EDF1F7; --grid:#EDF1F7; --badband:rgba(83,98,115,.13);
 --tip-bg:#131A2B; --tip-fg:#FFFFFF; --shadow:0 2px 12px rgba(30,64,140,.06);
 --sans:Pretendard,"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0E131D; --card:#171D29; --line:#283142; --fg:#EAF0F8; --sub:#A9B4C6; --mute:#7A8699;
 --blue:#5B8CFF; --hold:#5B8CFF; --hold-bg:#1B2A4A; --ok-bg:#1B2A4A; --line-main:#5B8CFF;
 --buy:#3CC77A; --buy-bg:#123222; --sell:#F2A13A; --sell-bg:#3A2A14; --red:#F06A60;
 --gray-bg:#1F2633; --track:#202837; --grid:#202837; --badband:rgba(169,180,198,.12);
 --tip-bg:#EAF0F8; --tip-fg:#0E131D; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0E131D; --card:#171D29; --line:#283142; --fg:#EAF0F8; --sub:#A9B4C6; --mute:#7A8699;
 --blue:#5B8CFF; --hold:#5B8CFF; --hold-bg:#1B2A4A; --ok-bg:#1B2A4A; --line-main:#5B8CFF;
 --buy:#3CC77A; --buy-bg:#123222; --sell:#F2A13A; --sell-bg:#3A2A14; --red:#F06A60;
 --gray-bg:#1F2633; --track:#202837; --grid:#202837; --badband:rgba(169,180,198,.12);
 --tip-bg:#EAF0F8; --tip-fg:#0E131D; --shadow:none; color-scheme:dark}
body{word-break:keep-all;overflow-wrap:break-word;letter-spacing:-.01em}
h1,header h1{font-weight:800!important;letter-spacing:-.03em}
h1,h2,h3{text-wrap:balance}
.card,.row{border-radius:18px!important;border:1px solid var(--line)!important;box-shadow:var(--shadow)}
/* 칩·탭 = 파랑 채움 흰 글씨 */
.chips button,.zoom button{border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-weight:600}
.chips button.sel,.zoom button.sel{background:var(--blue)!important;border-color:var(--blue)!important;color:#fff!important;box-shadow:0 3px 10px rgba(43,107,243,.25)}
.tabs{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px!important;box-shadow:var(--shadow)}
.tabs button{border:0!important;background:transparent!important;color:var(--mute)!important;font-weight:700!important;flex:0 0 auto}
.tabs button.sel{background:var(--blue)!important;color:#fff!important;box-shadow:0 3px 10px rgba(43,107,243,.25)}
.pill{font-weight:700!important;border-radius:999px}
button.more{color:var(--blue)!important;font-weight:700!important}
/* 파란 배너(집셈 홈 .hero) */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:20px 20px 18px;background:linear-gradient(135deg,#3D82FF 0%,#1E58E8 100%);color:#fff;box-shadow:0 10px 24px rgba(30,88,232,.25);display:grid;gap:12px}
.hero small{font-size:.8rem;font-weight:600;opacity:.85}
.hero b{display:block;font-size:1.32rem;font-weight:800;line-height:1.42;letter-spacing:-.02em}
.hero .hrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero .hrow div{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 10px 9px;display:grid;gap:2px;min-width:0}
.hero .hrow span{font-size:.74rem;font-weight:600;opacity:.9}
.hero .hrow strong{font-size:1.35rem;font-weight:800;line-height:1.1}
.hero .hrow em{font-style:normal;font-size:.74rem;opacity:.92;line-height:1.35}

</style>
<div class="wrap">
 <header><h1>자산 신호판</h1><p>2026.10.23 주 기준</p></header>
 <section class="hero" aria-label="이번 주 할 일"><small>이번 주 할 일 · 검증된 신호만</small><div id="todo" class="todo"></div><p id="why" class="why"></p></section>
 <details class="card" id="ex"><summary class="nm" style="font-size:15px;cursor:pointer">예시 · 그때 이 판을 봤다면</summary>
  <div class="chips" id="exchips" style="flex-wrap:wrap"></div>
  <label class="mini">아무 달이나: <input type="month" id="exmon" min="1990-01" style="font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)"></label>
  <div id="exrows" class="exrows"></div>
  <div class="mini">지금 규칙을 그때 자료로 적용한 결과 · 주식은 1년 뒤, 환율은 9개월 뒤 · ✓ 할 일과 결과가 맞음 ✗ 틀림</div>
 </details>
 <div id="cards" style="display:grid;gap:12px"></div>
 <details class="card" id="evo"><summary class="nm" style="font-size:14px;cursor:pointer">규칙 변경 기록</summary><div class="mini" id="evochk"></div><ul id="evolog" style="margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--sub);line-height:1.6"></ul></details>
 <p class="foot">과거 자료 기준 · 투자 권유 아님 · 세금·수수료 뺀 계산 · 상품 이름은 종류를 알리는 예시일 뿐 추천 아님 · 현금 = 미국 주식은 달러 3개월 국채(연 4.0%), 코스피는 원화 단기금리로 계산</p>

<script>
/* 주식 앱식 차트 부품 (2026-10-21). 로그 세로축 = 실제 값, 끌기=이동, 휠·두 손가락=확대·축소, 누르기=값 보기, 두 번 누르기=처음으로.
   LChart(canvas, data, opt)
   data = {p:[[t,v]...], bad:[[a,b]], sell:[[a,b]] 관망 신호, hold:[[a,b]] 신호 뒤 유지(후속 조치), buy:[[a,b]], known, unit}
   opt  = {view:{v0,v1} 공유 객체(여러 차트 맞춤), onView(), xmin, xmax, css(name)}  */
function LChart(c, d, opt) {
  const S = { hover: null, ptrs: new Map(), drag: null, pinch: null };
  const V = opt.view;
  const css = opt.css;
  const PADL = 54, PADR = 8, PADT = 8, PADB = 20;
  const t0 = d.p[0][0], t1 = d.p[d.p.length - 1][0];
  const XMIN = opt.xmin ?? t0, XMAX = (opt.xmax ?? t1) + 0.05;
  const inA = (arr, t) => { for (const [a, b] of arr) if (t >= a && t < b) return true; return false; };
  // 10-21: 주마다 상태 코드(d.s: M 매수 · R 강한 관망 · O 관망 · H 관망 유지 · N 보통)가 있으면 띠를 그 코드로만 만든다 → 겹침·어긋남 없음
  if (d.s && d.s.length === d.p.length) {
    const runs = c => { const out = []; let st = -1; for (let i = 0; i <= d.p.length; i++) { const on = i < d.p.length && d.s[i] === c; if (on && st < 0) st = i; if (!on && st >= 0) { out.push([d.p[st][0], i < d.p.length ? d.p[i][0] : d.p[i - 1][0] + 0.02]); st = -1; } } return out; };
    d.buy = runs("M"); d.strong = runs("R"); d.sell = runs("O"); d.hold = runs("H"); d.shold = runs("S");
  }
  function fmt(v) {
    const a = Math.abs(v);
    if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 0 : 1) + "M";
    if (a >= 1e4) return Math.round(v).toLocaleString("ko-KR");
    if (a >= 100) return Math.round(v).toLocaleString("ko-KR");
    if (a >= 10) return v.toFixed(1);
    if (a >= 1) return v.toFixed(2);
    return v.toPrecision(2);
  }
  function dstr(t) {
    const y = Math.floor(t), doy = (t - y) * 365.25, dt = new Date(Date.UTC(y, 0, 1) + doy * 864e5);
    return `${dt.getUTCFullYear()}.${String(dt.getUTCMonth() + 1).padStart(2, "0")}.${String(dt.getUTCDate()).padStart(2, "0")}`;
  }
  function geom() {
    const r = c.getBoundingClientRect();
    return { W: r.width, H: r.height, left: r.left, X: t => PADL + (t - V.v0) / (V.v1 - V.v0) * (r.width - PADL - PADR) };
  }
  function tAt(clientX) {
    const g = geom(); return V.v0 + (clientX - g.left - PADL) / (g.W - PADL - PADR) * (V.v1 - V.v0);
  }
  function clampView() {
    let span = Math.max(0.15, Math.min(XMAX - XMIN, V.v1 - V.v0));
    let a = V.v0, b = a + span;
    if (a < XMIN) { a = XMIN; b = a + span; }
    if (b > XMAX) { b = XMAX; a = b - span; }
    V.v0 = a; V.v1 = b;
  }
  function zoomAt(t, f) {
    V.v0 = t - (t - V.v0) * f; V.v1 = t + (V.v1 - t) * f; clampView(); opt.onView();
  }
  function nearest(t) {
    let lo = 0, hi = d.p.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (d.p[m][0] <= t) lo = m; else hi = m; }
    return Math.abs(d.p[hi][0] - t) < Math.abs(d.p[lo][0] - t) ? d.p[hi] : d.p[lo];
  }
  function draw() {
    const dp = devicePixelRatio || 1, r = c.getBoundingClientRect();
    c.width = r.width * dp; c.height = r.height * dp;
    const g = c.getContext("2d"); g.setTransform(dp, 0, 0, dp, 0, 0);
    const W = r.width, H = r.height, X = t => PADL + (t - V.v0) / (V.v1 - V.v0) * (W - PADL - PADR);
    const vis = d.p.filter(p => p[0] >= V.v0 - 0.1 && p[0] <= V.v1 + 0.1);
    g.font = "11px " + css("--sans"); g.fillStyle = css("--mute");
    if (vis.length < 2) { g.textAlign = "left"; g.fillText("이 구간 자료 없음", PADL + 8, H / 2); return; }
    const lv = vis.map(p => Math.log(p[1])), lo = Math.min(...lv), hi = Math.max(...lv), pd = (hi - lo) * 0.08 || 0.05;
    const Y = v => PADT + (1 - (Math.log(v) - lo + pd) / (hi - lo + 2 * pd)) * (H - PADT - PADB);
    // 세로 눈금 = 실제 값(1·2·5 단위)
    const vlo = Math.exp(lo - pd), vhi = Math.exp(hi + pd); let ticks = [];
    for (let e = Math.floor(Math.log10(vlo)) - 1; e <= Math.ceil(Math.log10(vhi)) + 1; e++)
      for (const m of [1, 1.5, 2, 3, 5, 7]) { const v = m * Math.pow(10, e); if (v >= vlo && v <= vhi) ticks.push(v); }
    const used = []; g.textAlign = "right";
    for (const v of ticks.sort((a, b) => a - b)) {
      const yy = Y(v); if (yy < PADT + 6 || yy > H - PADB - 4 || used.some(u => Math.abs(u - yy) < 20)) continue; used.push(yy);
      g.strokeStyle = css("--grid"); g.lineWidth = 1; g.beginPath(); g.moveTo(PADL, yy); g.lineTo(W - PADR, yy); g.stroke();
      g.fillStyle = css("--mute"); g.fillText(fmt(v), PADL - 6, yy + 4);
    }
    g.save(); g.beginPath(); g.rect(PADL, 0, W - PADL - PADR, H); g.clip();
    // 가로 눈금
    const span = V.v1 - V.v0; g.textAlign = "center";
    if (span > 3) {
      const st = span > 40 ? 10 : span > 18 ? 5 : span > 8 ? 2 : 1;
      for (let y = Math.ceil(V.v0 / st) * st; y <= V.v1; y += st) {
        g.strokeStyle = css("--grid"); g.beginPath(); g.moveTo(X(y), PADT); g.lineTo(X(y), H - PADB); g.stroke();
        g.fillStyle = css("--mute"); g.fillText(String(y), X(y), H - 5);
      }
    } else {
      const stepM = span > 1.5 ? 3 : 1;
      for (let m = Math.ceil(V.v0 * 12 / stepM) * stepM; m <= V.v1 * 12; m += stepM) {
        const t = m / 12, yr = Math.floor(t), mo = Math.round((t - yr) * 12) + 1;
        g.strokeStyle = css("--grid"); g.beginPath(); g.moveTo(X(t), PADT); g.lineTo(X(t), H - PADB); g.stroke();
        g.fillStyle = css("--mute"); g.fillText(mo === 1 ? String(yr) : `${String(yr).slice(2)}.${String(mo).padStart(2, "0")}`, X(t), H - 5);

function probOf(d,c){
 if(d.fxcard){if(c==="D")return `미뤄서 ${d.evn}번 중 ${d.evk}번 이득`;if(c==="V")return `${d.inn}번 중 ${d.ink}번 이득`;return ""}
 const E=d.ev||{},st=d.stats||{},best=a=>a&&a.length?a.reduce((x,y)=>y.n>x.n?y:x):null;
 if(c==="M"){const x=st["매수"];return x&&x.n1?`사서 1년 · ${x.n1}번 중 ${x.k1}번 이득`:""}
 if(c==="R"||c==="O"){const e=best(E.sell_ev);return e?(E.nobuy?`안 산 게 맞음 ${e.n}번 중 ${e.k}번`:`팔고 기다린 게 맞음 ${e.n}번 중 ${e.k}번`):""}
 if(c==="H"||c==="S"){const x=st["관망유지"];return x&&x.n1?`이때 샀다면 1년 · ${x.n1}번 중 ${x.k1}번 이득`:""}
 const x=st["보통"];return x&&x.n1?`사서 1년 · ${x.n1}번 중 ${x.k1}번 이득`:"";
}
D.forEach(d=>{if(!d.fxcard)d.pl={"매수 신호":probOf(d,"M"),"강한 관망":probOf(d,"R"),"관망 신호":probOf(d,"O"),"강한 관망 유지(신호 뒤 1년)":probOf(d,"S"),"관망 유지(신호 뒤 1년)":probOf(d,"H"),"보통 · 신호 없음":probOf(d,"N")};
 else d.pl={"환전 미루기":probOf(d,"D")}});

function draw(d){
 const el=document.getElementById("a_"+d.id),c=el.querySelector("canvas");
 const last=d.p[d.p.length-1][0]+0.05, first=d.p[0][0];
 if(!CH[d.id]){
  const view={v0:last-10,v1:last};
  CH[d.id]={view,ch:LChart(c,{p:d.p,s:d.s,pl:d.pl,bad:[],sell:d.sell,strong:d.strong,hold:d.hold,buy:d.buy,marks:d.marks,ref:d.ref,ref2:null,known:null,unit:d.unit,sellTxt:d.sellTxt},
   {view,css,xmin:first,xmax:last-0.05,onView:()=>draw(d),reset:()=>{view.v0=last-10;view.v1=last;draw(d)}})};
 }
 const V=CH[d.id].view;
 el.querySelectorAll(".chips button").forEach(b=>{const y=+b.dataset.y;b.classList.toggle("sel",y===0?V.v0<=first+0.01:Math.abs(V.v1-V.v0-y)<0.05&&V.v1>=last-0.06)});
 CH[d.id].ch.draw();
}
addEventListener("resize",()=>D.forEach(d=>{const b=document.querySelector("#a_"+d.id+" .chartbox");if(b&&!b.hidden)draw(d)}));
