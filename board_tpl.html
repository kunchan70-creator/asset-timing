:root{

 --track:#EDF0F5; --grid:#EEF1F6; --badband:rgba(120,128,140,.18); --line-main:#2B6BF3; --tip-bg:#141B26; --tip-fg:#FFFFFF;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0E131A; --card:#161D27; --line:#253041; --fg:#E9EEF5; --sub:#A4AFBF; --mute:#748094;
 --buy:#3CC77A; --buy-bg:#123222; --sell:#F2994A; --sell-bg:#3A2614; --hold:#6E9AF8; --hold-bg:#18243D;
 --track:#222B37; --grid:#1E2733; --badband:rgba(170,180,195,.16); --line-main:#6E9AF8; --tip-bg:#E9EEF5; --tip-fg:#0E131A; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0E131A; --card:#161D27; --line:#253041; --fg:#E9EEF5; --sub:#A4AFBF; --mute:#748094;
 --buy:#3CC77A; --buy-bg:#123222; --sell:#F2994A; --sell-bg:#3A2614; --hold:#6E9AF8; --hold-bg:#18243D;
 --track:#222B37; --grid:#1E2733; --badband:rgba(170,180,195,.16); --line-main:#6E9AF8; --tip-bg:#E9EEF5; --tip-fg:#0E131A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 36px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:14px}
header h1{font-size:22px;font-weight:700;margin:0}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border-radius:14px;padding:12px 10px;display:grid;gap:4px;min-width:0}
.tile .k{font-size:12.5px;font-weight:500}
.tile .n{font-size:24px;font-weight:700;line-height:1.1}
.tile .w{font-size:12px;line-height:1.35;word-break:keep-all}
.t-buy{background:var(--buy-bg);color:var(--buy)} .t-sell{background:var(--sell-bg);color:var(--sell)} .t-hold{background:var(--hold-bg);color:var(--hold)}
.sec{font-size:13px;color:var(--sub);font-weight:500;margin:6px 2px -4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nm{font-size:17px;font-weight:700}
.prod{font-size:12.5px;color:var(--mute);margin-top:-8px}
.pill{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.p-매수{background:var(--buy-bg);color:var(--buy)} .p-강한관망{background:var(--red);color:#fff} .p-관망,.p-관망유지{background:var(--sell-bg);color:var(--sell)} .p-보통{background:var(--hold-bg);color:var(--hold)}
.note{font-size:12.5px;color:var(--sub);background:var(--track);border-radius:10px;padding:8px 10px}
.act{font-size:15px;font-weight:500}
.prob{display:grid;gap:6px}
.prob .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.prob .lab{font-size:12.5px;color:var(--sub)}
.prob .big{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.mini{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
button.more{all:unset;cursor:pointer;font-size:13px;color:var(--hold);font-weight:500;justify-self:start;padding:2px 0}
button.more:focus-visible{outline:2px solid var(--hold);outline-offset:2px;border-radius:4px}
.chartbox{display:grid;gap:8px}
.chips{display:flex;gap:6px}
.chips button{font:inherit;font-size:12.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.chips button.sel{background:var(--hold);border-color:var(--hold);color:#fff}
canvas{width:100%;height:240px;display:block;cursor:crosshair}
.hint{font-size:12px;color:var(--mute)}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--sub)}
.leg i{display:inline-block;width:12px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.eph{font-size:12.5px;font-weight:700;margin-top:4px}
.eps{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.eps li{display:flex;gap:8px;align-items:flex-start}
.eps i{flex:none;min-width:28px;font-style:normal;font-size:11.5px;font-weight:700}
.eps b{color:var(--fg)}
.todo{display:grid;gap:6px;margin-top:8px}
.tr{display:grid;grid-template-columns:64px auto 1fr;gap:8px;align-items:center;background:rgba(255,255,255,.14);border-radius:10px;padding:7px 10px;min-width:0}
.tn{font-weight:700;font-size:14px}
.ta{font-weight:700;font-size:13px;background:#fff;color:var(--c);border-radius:999px;padding:2px 9px;white-space:nowrap}
.tw{font-size:12px;opacity:.9;min-width:0}
.why{margin:10px 0 0;font-size:13px;line-height:1.6;opacity:.95}
.prob .big{font-family:var(--sans);font-size:22px;font-weight:700}
.prob .row{border:0!important;box-shadow:none!important;border-radius:0!important}
.tally{display:flex;flex-wrap:wrap;gap:4px}
.tally i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.tally i.n{background:transparent;border:2px solid var(--mute);opacity:.6}
.fxbar{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--hold-bg),var(--sell-bg));margin-top:4px}
.fxbar i{position:absolute;top:-4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--hold);border:2px solid var(--card)}
.fxbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--mute)}
.fxlab{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.exrows{display:grid;gap:6px}
.exr{display:grid;grid-template-columns:64px auto 1fr;gap:8px;align-items:center;font-size:13px}
.exr .ta{background:var(--track)}
.exr .tw{font-size:12.5px;color:var(--sub)}
.crit{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:12.5px;color:var(--sub)}
.crit dt{font-weight:700;color:var(--fg)}
.crit dd{margin:0;min-width:0}
.hint{display:none}
.foot{font-size:12px;color:var(--mute);line-height:1.6}

 <header><h1>자산 신호판</h1><p>__ASOF__ 주 기준</p></header>

 <p class="foot">과거 자료 기준 · 투자 권유 아님 · 세금·수수료 뺀 계산 · 상품 이름은 종류를 알리는 예시일 뿐 추천 아님 · 현금 = 미국 주식은 달러 3개월 국채(연 __TB3__%), 코스피는 원화 단기금리로 계산</p>
</div>

{const NB=TODO.filter(t=>t.k==="wait"&&t.act==="새로 사지 않기"&&!t.nm.includes("→")),S=TODO.filter(t=>t.k==="sell"&&!t.nm.includes("→")),B=TODO.filter(t=>t.k==="buy"),O=TODO.filter(t=>t.k==="ok"&&!t.nm.includes("→")),F=TODO.find(t=>t.nm==="원→달러"),FB=TODO.find(t=>t.nm==="달러→원");

  else if(s.n1){nn=s.n1;kk=s.k1;note=" · 1년씩 안 겹치게"}
  big=nn?Math.round(kk/nn*100)+"%":"–";
  if(d.now==="강한관망")sub+=`<br>과열 압력 ${d.press.length}개: ${d.press.join(" · ")}`;
 }
 const el=document.createElement("article");el.className="card";el.id="a_"+d.id;
 el.innerHTML=`<div class="top"><span class="nm">${d.name}</span><span class="pill ${pcls}">${pill}</span></div>
 <div class="act">${act}</div>
 <div class="prob"><div class="row"><span class="lab">${lab}</span><span class="big">${big}</span></div>
 ${fxg?`<div class="fxbar"><i style="left:${fxg.pos}%"></i><b style="left:50%"></b></div><div class="fxlab"><span>${fxg.lo.toLocaleString()}</span><span>평균 ${fxg.avg.toLocaleString()}</span><span>${fxg.hi.toLocaleString()}부터 미루기</span></div>`
  :nn?`<div class="tally">${Array.from({length:nn},(_,i)=>`<i class="${i<kk?"y":"n"}" style="--c:var(${col})"></i>`).join("")}</div><div class="mini">${nn}번 중 ${kk}번 ${E.nobuy&&isSell?"사지 않은 게 맞음":"이득"}${note}</div>`:""}</div>
 ${sub?`<div class="mini">${sub}</div>`:""}
 <button class="more" aria-expanded="false">차트</button>
 <div class="chartbox" hidden>
  <div class="chips">${[["3년",3],["10년",10],["전체",0]].map(([l,y])=>`<button data-y="${y}">${l}</button>`).join("")}</div>
  <canvas aria-label="${d.name} 가격과 신호"></canvas>
    <div class="leg"><span><i style="background:var(--sell);opacity:.4"></i>${d.fxcard?"환전 미루기":"관망"}</span>${d.strong&&d.strong.length?'<span><i style="background:var(--red);opacity:.45"></i>강한 관망</span><span><i style="background:repeating-linear-gradient(135deg,var(--red) 0 1px,transparent 1px 5px);opacity:.7"></i>강한 관망 유지 1년</span>':""}${d.hold&&d.hold.length?'<span><i style="background:repeating-linear-gradient(135deg,var(--sell) 0 1px,transparent 1px 5px);opacity:.6"></i>관망 유지 1년</span>':""}${d.buy&&d.buy.length?'<span><i style="background:var(--buy);opacity:.35"></i>매수</span>':""}${d.fxcard?'<span><i style="border-top:2px dotted var(--sell);height:0;width:14px"></i>위 = 환전 미루기</span>':""}<span>${d.fxcard?'<b style="color:var(--sell)">▼</b> 원→달러 미루기 · <b style="color:var(--red)">▼</b> 달러→원화':'<b style="color:var(--buy)">▲</b> 매수 · <b style="color:var(--red)">▼</b> 경고'}</span></div>
  <dl class="crit">${d.fxcard?`<dt>원→달러</dt><dd>5년 평균 +15% 위면 미루기 · 내려오면 바꿈 · 그 밖엔 평소대로</dd><dt>달러→원</dt><dd>5년 평균 +10% 위에서 13주 고점 대비 5% 꺾이면 · 5년 평균 +5%까지 내려오면(최대 9개월) 끝</dd>`:
   `${d.rule?`<dt>관망</dt><dd>${d.rule}</dd>`:""}${d.buyrule?`<dt>매수</dt><dd>${d.buyrule} · 단, 경고 중이거나 마지막 경고 뒤 6개월 안이면 무시</dd>`:""}${E.buy_follow?`<dt>따라 사기</dt><dd>${E.buy_follow} 매수 신호가 켜져도 삼(같은 경고 조건 적용)</dd>`:""}${["nasdaq","spx"].includes(d.id)?`<dt>공포 매수</dt><dd>RSI(14) 30 미만 + 공포지수(VIX) 30 이상 · 단, 경고 중이거나 마지막 경고 뒤 1년 안이면 무시</dd>`:""}<dt>맞음</dt><dd>경고: 마지막 경고 뒤 1년까지 현금이 나았으면 · 매수: 1년 뒤 자산이 나았으면</dd><dt>상위 n%</dt><dd>지난 20년 중 높은 쪽 n%</dd>${E.cands&&E.cands.length?`<dt>후보</dt><dd>${E.cands.join(" / ")} (아직 안 따름)</dd>`:""}`}</dl>
 </div>`;
 cards.appendChild(el);
 const btn=el.querySelector(".more"),box=el.querySelector(".chartbox");
 btn.addEventListener("click",()=>{box.hidden=!box.hidden;btn.setAttribute("aria-expanded",String(!box.hidden));btn.textContent=box.hidden?"차트":"접기";if(!box.hidden)draw(d)});
 el.querySelectorAll(".chips button").forEach(b=>b.addEventListener("click",()=>{draw(d);const V=CH[d.id].view,last=d.p[d.p.length-1][0]+0.05,y=+b.dataset.y;V.v1=last;V.v0=y?last-y:d.p[0][0];draw(d)}));
});
function eplist(d){
 const ms=(d.marks||[]).slice().sort((a,b)=>a.t0-b.t0);const cnt={};ms.forEach(m=>m.no=cnt[m.kind]=(cnt[m.kind]||0)+1);
 const MC={buy:"--buy",bulk:"--buy",sell:"--red",inv:"--red",defer:"--sell"},up=k=>k==="buy"||k==="bulk";
 const row=(m,t)=>`<li><i style="color:var(${m.ok===false?"--mute":MC[m.kind]})">${up(m.kind)?"▲":"▼"}${m.no}</i><span>${t}</span></li>`;
 const sec=(title,rs)=>rs.length?`<div class="eph">${title}</div><ul class="eps">${rs.join("")}</ul>`:"";
 const S=ms.filter(m=>m.kind==="sell"),B=ms.filter(m=>m.kind==="buy");
 if(d.fxcard)return sec("환전 미루기",ms.filter(m=>m.kind==="defer").map(m=>row(m,m.done?`${m.d0}~${m.d1} · 그때 바꿨으면 평균 ${m.avg.toLocaleString()}원 → 미뤄서 ${m.fxj.toLocaleString()}원 · <b>${m.g}% 싸게</b>`:`${m.d0}~ 미루는 중`)))
  +sec("몰아서 환전 (참고)",ms.filter(m=>m.kind==="bulk").map(m=>row(m,m.done?`${m.d0} · ${m.fxa.toLocaleString()}원에 1년치 몰아서 → 나눠 바꾼 것보다 <b>${m.g>0?"+":""}${m.g}%</b>`:`${m.d0}~ 진행 중 (지금)`)))
  +sec("달러 인버스 (참고)",ms.filter(m=>m.kind==="inv").map(m=>row(m,m.done?`${m.d0}~${m.d1} · ${m.fxa.toLocaleString()} → ${m.fxj.toLocaleString()}원 · <b>${m.g>0?"+":""}${m.g}%</b> · 중간 최대 손실 ${m.worst}%`:`${m.d0}~ 진행 중`)));
 const f=(m,w)=>`${m.d0} · ${m.done?w:"지금까지"} <b>${m.chg>0?"+":""}${m.chg}%</b>${m.ok===false?" · 틀림":""}`;
 return sec("관망 경고",S.slice(-8).map(m=>row(m,f(m,"마지막 경고 뒤 1년까지")))) +sec("매수",B.slice(-8).map(m=>row(m,f(m,"1년 뒤"))));
}
// 10-21 사용자: '여러 시점을 놓고 example' — 그 주의 상태 코드로 할 일을 다시 만들고 1년(환율 9개월) 뒤 결과를 붙임
const EXD=[["2000.03","닷컴 꼭대기"],["2002.10","닷컴 바닥"],["2007.10","금융위기 전"],["2009.03","금융위기 바닥"],["2018.01","2018 고점"],["2020.03","코로나 급락"],["2021.11","2021 꼭대기"],["2022.10","2022 바닥"],["2025.04","관세 급락"]];
const tOf=s=>{const[y,m]=s.split(".").map(Number);return y+(m-0.5)/12};
const at=(d,t)=>{if(!d.p.length||t<d.p[0][0])return -1;let lo=0,hi=d.p.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(d.p[m][0]<=t)lo=m;else hi=m}return d.p[hi][0]<=t?hi:lo};
function exShow(lbl){
 const t=tOf(lbl),rows=[];
 [...D].sort((a,b)=>(!!a.fxcard)-(!!b.fxcard)).forEach(d=>{
  const i=at(d,t);if(i<0)return;const H=d.fxcard?0.75:1,j=at(d,t+H);
  const chg=j>i&&d.p[j][0]>=t+H-0.03?(d.p[j][1]/d.p[i][1]-1)*100:null;
  let act,kind;
  if(d.fxcard){const c=(d.fs||"")[i];act=c==="V"?"달러→원화 되돌리기":c==="D"?"원→달러 미루기":"원→달러 평소대로";kind=c==="N"?"buy":"sell"}
  else{const c=(d.s||"")[i],E=d.ev||{},s0=d.stats["보통"]||{},ok=(s0.n1||0)>=20&&s0.k1/s0.n1>=0.7;
   if(c==="M"){act="사기";kind="buy"}else if(c==="R"||c==="O"){act=E.nobuy?"새로 사지 않기":"팔고 현금";kind="sell"}
   else if(c==="H"||c==="S"){act="새로 사지 않기";kind="sell"}else{act=ok?"사서 들고 가기":"신호 없음";kind=ok?"buy":"none"}}
  const res=chg==null?"아직 모름":`${d.fxcard?"9개월 뒤 환율":"1년 뒤"} ${chg>0?"+":""}${chg.toFixed(0)}%`;
  const good=chg==null||kind==="none"?"":(kind==="buy")===(chg>0)?"✓":"✗";
  const code=d.fxcard?(d.fs||"")[i]:(d.s||"")[i],pr=probOf(d,code);
  rows.push(`<div class="exr"><span class="tn">${d.fxcard?"환율":d.name}</span><span class="ta" style="--c:var(${kind==="buy"?"--buy":kind==="sell"?"--red":"--mute"})">${act}</span><span class="tw">${res} <b>${good}</b>${pr?`<br><small>${pr}</small>`:""}</span></div>`)});
 document.getElementById("exrows").innerHTML=rows.join("");
 document.querySelectorAll("#exchips button").forEach(b=>b.classList.toggle("sel",b.dataset.d===lbl));
}
document.getElementById("exchips").innerHTML=EXD.map(([d,n])=>`<button data-d="${d}">${d} ${n}</button>`).join("");
document.querySelectorAll("#exchips button").forEach(b=>b.addEventListener("click",()=>exShow(b.dataset.d)));
setTimeout(()=>exShow("2021.11"),0);
{const mi=document.getElementById("exmon");const L=D[1]&&D[1].p.length?D[1].p[D[1].p.length-1][0]:2026;mi.max=`${Math.floor(L)}-12`;
 mi.addEventListener("change",()=>{if(mi.value){const[y,m]=mi.value.split("-");exShow(`${y}.${m}`)}});}
// 10-21 사용자: '관망이든 매수든 확률 표기' — 상태 코드마다 과거 사건 수로 한 줄
function probOf(d,c){
 if(d.fxcard){if(c==="D")return `미뤄서 ${d.evn}번 중 ${d.evk}번 이득`;if(c==="V")return `${d.inn}번 중 ${d.ink}번 이득`;return ""}
 const E=d.ev||{},st=d.stats||{},best=a=>a&&a.length?a.reduce((x,y)=>y.n>x.n?y:x):null;
 if(c==="M"){const x=st["매수"];return x&&x.n1?`사서 1년 · ${x.n1}번 중 ${x.k1}번 이득`:""}
 if(c==="R"||c==="O"){const e=best(E.sell_ev);return e?(E.nobuy?`안 산 게 맞음 ${e.n}번 중 ${e.k}번`:`팔고 기다린 게 맞음 ${e.n}번 중 ${e.k}번`):""}
 if(c==="H"||c==="S"){const x=st["관망유지"];return x&&x.n1?`이때 샀다면 1년 · ${x.n1}번 중 ${x.k1}번 이득`:""}
 const x=st["보통"];return x&&x.n1?`사서 1년 · ${x.n1}번 중 ${x.k1}번 이득`:"";
}
D.forEach(d=>{if(!d.fxcard)d.pl={"매수 신호":probOf(d,"M"),"강한 관망":probOf(d,"R"),"관망 신호":probOf(d,"O"),"강한 관망 유지(신호 뒤 1년)":probOf(d,"S"),"관망 유지(신호 뒤 1년)":probOf(d,"H"),"보통 · 신호 없음":probOf(d,"N")};
 else d.pl={"환전 미루기":probOf(d,"D")}});
const CH={};
const EVO=__EVOLOG__;document.getElementById("evochk").textContent=EVO.checked?`마지막 점검 ${EVO.checked}`:"";document.getElementById("evolog").innerHTML=EVO.lines.map(x=>`<li>${x.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</li>`).join("")||"<li>변경 없음</li>";
function draw(d){
 const el=document.getElementById("a_"+d.id),c=el.querySelector("canvas");
 const last=d.p[d.p.length-1][0]+0.05, first=d.p[0][0];
 if(!CH[d.id]){
  const view={v0:last-10,v1:last};
  CH[d.id]={view,ch:LChart(c,{p:d.p,s:d.s,pl:d.pl,bad:[],sell:d.sell,strong:d.strong,hold:d.hold,buy:d.buy,marks:d.marks,ref:d.ref,ref2:null,known:null,unit:d.unit,sellTxt:d.sellTxt},
   {view,css,xmin:first,xmax:last-0.05,onView:()=>draw(d),reset:()=>{view.v0=last-10;view.v1=last;draw(d)}})};
 }
 const V=CH[d.id].view;
 el.querySelectorAll(".chips button").forEach(b=>{const y=+b.dataset.y;b.classList.toggle("sel",y===0?V.v0<=first+0.01:Math.abs(V.v1-V.v0-y)<0.05&&V.v1>=last-0.06)});
 CH[d.id].ch.draw();
}
addEventListener("resize",()=>D.forEach(d=>{const b=document.querySelector("#a_"+d.id+" .chartbox");if(b&&!b.hidden)draw(d)}));
