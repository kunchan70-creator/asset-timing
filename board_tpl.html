  rows.push(`<div class="exr"><span class="tn">${d.fxcard?"환율":d.name}</span><span class="ta" style="--c:var(${kind==="buy"?"--buy":kind==="sell"?"--red":"--mute"})">${act}</span><span class="tw">${res} <b>${good}</b>${pr?`<br><small>${pr}</small>`:""}</span></div>`)});
 document.getElementById("exrows").innerHTML=rows.join("");
 document.querySelectorAll("#exchips button").forEach(b=>b.classList.toggle("sel",b.dataset.d===lbl));
}
if(document.getElementById("exchips")){document.getElementById("exchips").innerHTML=EXD.map(([d,n])=>`<button data-d="${d}">${d} ${n}</button>`).join("");}
if(document.getElementById("exchips")){document.querySelectorAll("#exchips button").forEach(b=>b.addEventListener("click",()=>exShow(b.dataset.d)));}
if(document.getElementById("exchips")){setTimeout(()=>exShow("2021.11"),0);}
if(document.getElementById("exmon")){const mi=document.getElementById("exmon");const L=D[1]&&D[1].p.length?D[1].p[D[1].p.length-1][0]:2026;mi.max=`${Math.floor(L)}-12`;
 mi.addEventListener("change",()=>{if(mi.value){const[y,m]=mi.value.split("-");exShow(`${y}.${m}`)}});}
// 10-21 사용자: '관망이든 매수든 확률 표기' — 상태 코드마다 과거 사건 수로 한 줄
function probOf(d,c){
 if(d.fxcard){if(c==="D")return `미뤄서 ${pct(d.evk,d.evn)} 이득`;if(c==="V")return `${pct(d.ink,d.inn)} 이득`;return ""}
 const E=d.ev||{},st=d.stats||{},best=a=>a&&a.length?a.reduce((x,y)=>y.n>x.n?y:x):null;
 if(c==="M"){const x=st["매수"];return x&&x.n1?`사서 1년 · ${pct(x.k1,x.n1)} 이득`:""}
 if(c==="R"||c==="O"){const e=best(E.sell_ev);return e?(E.nobuy?`안 산 게 맞음 ${pct(e.k,e.n)}`:`팔고 기다린 게 맞음 ${pct(e.k,e.n)}`):""}
 if(c==="H"||c==="S"){const x=st["관망유지"];return x&&x.n1?`이때 샀다면 1년 · ${pct(x.k1,x.n1)} 이득`:""}
 const x=st["보통"];return x&&x.n1?`사서 1년 · ${pct(x.k1,x.n1)} 이득`:"";
}
D.forEach(d=>{if(!d.fxcard)d.pl={"매수 신호":probOf(d,"M"),"강한 관망":probOf(d,"R"),"관망 신호":probOf(d,"O"),"강한 관망 유지(신호 뒤 1년)":probOf(d,"S"),"관망 유지(신호 뒤 1년)":probOf(d,"H"),"보통 · 신호 없음":probOf(d,"N")};
 else d.pl={"환전 미루기":probOf(d,"D")}});
const CH={};
if(document.getElementById("evochk")){const EVO=__EVOLOG__;document.getElementById("evochk").textContent=EVO.checked?`마지막 점검 ${EVO.checked}`:"";document.getElementById("evolog").innerHTML=EVO.lines.map(x=>`<li>${x.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</li>`).join("")||"<li>변경 없음</li>";}
function draw(d){
 const el=document.getElementById("a_"+d.id),c=el.querySelector("canvas");
 const last=d.p[d.p.length-1][0]+0.05, first=d.p[0][0];
 if(!CH[d.id]){
  const yrs=innerWidth<600?3:10,view={v0:last-yrs,v1:last};   // 11-02: 폰은 3년부터
  if(d.ind)c.style.height="380px";   // 11-01: 보조 차트 자리
  CH[d.id]={view,ch:LChart(c,{p:d.p,s:d.s,pl:d.pl,bad:[],sell:d.sell,strong:d.strong,hold:d.hold,buy:d.buy,marks:d.marks,ref:d.ref,ref2:null,known:null,unit:d.unit,sellTxt:d.sellTxt,ind:d.ind,rg:d.regime?d.regime.bands:null},
   {view,css,xmin:first,xmax:last-0.05,onView:()=>draw(d),reset:()=>{view.v0=last-yrs;view.v1=last;draw(d)}})};
 }
 const V=CH[d.id].view;
 el.querySelectorAll(".chips button").forEach(b=>{const y=+b.dataset.y;b.classList.toggle("sel",y===0?V.v0<=first+0.01:Math.abs(V.v1-V.v0-y)<0.05&&V.v1>=last-0.06)});
 CH[d.id].ch.draw();
}
addEventListener("resize",()=>D.forEach(d=>{const b=document.querySelector("#a_"+d.id+" .chartbox");if(b&&!b.hidden)draw(d)}));
</script>
