name: board-update
on:
  schedule:
    - cron: "30 22 * * *"            # 매일 07:30 KST 전체 자료
    - cron: "*/15 13-21 * * 1-5"     # 미국 장 15분마다 시세
    - cron: "*/15 0-6 * * 1-5"       # 한국 장 15분마다 시세
  workflow_dispatch:
    inputs:
      mode: { description: "full / quick", default: quick }
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
env:
  TZ: Asia/Seoul
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: full
        if: github.event.schedule == '30 22 * * *' || inputs.mode == 'full'
        run: python update_all.py || (cat logs/update.txt; exit 1)
      - name: quick
        if: github.event.schedule != '30 22 * * *' && inputs.mode != 'full'
        run: python update_all.py quick || (cat logs/update.txt; exit 1)
      - name: commit data
        if: github.event.schedule == '30 22 * * *' || inputs.mode == 'full'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily update $(date -u +%F)"
          git push
      - name: site
        run: mkdir -p site && cp board.html site/index.html && cp evidence.html site/evidence.html && (cp history.html site/history.html || true) && touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
